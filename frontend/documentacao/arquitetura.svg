<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <title>Arquitetura do RPGCardGame (AuroraRPG)</title>
  <defs>
    <marker id="seta" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b2a5a"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>

  <!-- Navegador / Front -->
  <rect x="20" y="130" width="220" height="140" rx="10" fill="#efe6ff" stroke="#3b2a5a" stroke-width="2"/>
  <text x="130" y="160" text-anchor="middle" font-weight="bold">Interface (Front-End)</text>
  <text x="130" y="184" text-anchor="middle">HTML + CSS + JS puro</text>
  <text x="130" y="204" text-anchor="middle">nginx :5500 (Docker)</text>
  <text x="130" y="224" text-anchor="middle">repo: RPGCardGame-frontend</text>
  <text x="130" y="250" text-anchor="middle" font-size="12" fill="#555">componente principal</text>

  <!-- Backend -->
  <rect x="340" y="90" width="220" height="220" rx="10" fill="#e3f1ff" stroke="#3b2a5a" stroke-width="2"/>
  <text x="450" y="120" text-anchor="middle" font-weight="bold">API (Back-End)</text>
  <text x="450" y="144" text-anchor="middle">Node + Express + TypeScript</text>
  <text x="450" y="164" text-anchor="middle">:3000 (Docker)</text>
  <text x="450" y="194" text-anchor="middle">/auth  /personagens</text>
  <text x="450" y="214" text-anchor="middle">/tickets  /admin</text>
  <text x="450" y="234" text-anchor="middle">/monsters ... (24 entidades)</text>
  <text x="450" y="264" text-anchor="middle" font-size="12" fill="#555">JWT + Zod + validação</text>
  <text x="450" y="284" text-anchor="middle" font-size="12" fill="#555">segunda componente</text>

  <!-- SQLite -->
  <rect x="340" y="335" width="220" height="50" rx="25" fill="#fff3d6" stroke="#3b2a5a" stroke-width="2"/>
  <text x="450" y="365" text-anchor="middle" font-weight="bold">SQLite (persistência)</text>

  <!-- API externa -->
  <rect x="660" y="130" width="220" height="140" rx="10" fill="#e6f7e6" stroke="#3b2a5a" stroke-width="2"/>
  <text x="770" y="160" text-anchor="middle" font-weight="bold">API externa pública</text>
  <text x="770" y="184" text-anchor="middle">D&amp;D 5e API</text>
  <text x="770" y="204" text-anchor="middle">dnd5eapi.co/api/2014</text>
  <text x="770" y="224" text-anchor="middle">sem cadastro / gratuita</text>

  <!-- Setas -->
  <line x1="240" y1="180" x2="338" y2="180" stroke="#3b2a5a" stroke-width="2" marker-end="url(#seta)"/>
  <text x="289" y="170" text-anchor="middle" font-size="12">GET POST</text>
  <text x="289" y="198" text-anchor="middle" font-size="12">PUT DELETE</text>
  <text x="289" y="214" text-anchor="middle" font-size="11" fill="#555">JSON + JWT</text>

  <line x1="562" y1="200" x2="658" y2="200" stroke="#3b2a5a" stroke-width="2" marker-end="url(#seta)"/>
  <text x="610" y="190" text-anchor="middle" font-size="12">GET (axios)</text>

  <line x1="450" y1="312" x2="450" y2="333" stroke="#3b2a5a" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Fallback -->
  <path d="M130 130 C130 40, 770 40, 770 128" fill="none" stroke="#a33" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#seta)"/>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#a33">fallback direto (só bestiário, se o backend estiver fora do ar)</text>
</svg>
