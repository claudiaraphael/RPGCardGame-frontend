<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuroraRPG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="components/shared/tokens.css">
    <link rel="stylesheet" href="components/shared/base.css">
    <link rel="stylesheet" href="components/shared/components.css">
    <script src="components/shared/orbs.js" defer></script>
    <link rel="stylesheet" href="components/shared/card-fx.css">
    <link rel="stylesheet" href="components/landing/landing.css">
</head>
<body>
    <!-- Brasas (tsParticles) — preenchido por components/landing/landing.js -->
    <div id="heroParticles"></div>
    <div class="pixel-orb orb-1"></div>
    <div class="pixel-orb orb-2"></div>
    <div class="pixel-orb orb-3"></div>
    <div class="pixel-orb orb-4"></div>

    <header>
        <div class="header-content">
            <a href="index.html" class="brand">
                <div class="brand-emblem">A</div>
                <div class="brand-title"><h1>AuroraRPG</h1></div>
            </a>

            <ul class="nav-links">
                <li><a href="index.html" class="active">Início</a></li>
                <li><a href="components/bestiario/monster-index.html">Bestiário</a></li>
                <li><a href="components/personagens/personagens.html">Personagens</a></li>
                <li><a href="components/suporte/suporte.html">Suporte</a></li>
            </ul>

            <!-- Preenchido em runtime por components/shared/session.js -->
            <div class="auth-bar" id="authBar" data-login-href="components/login/login.html"></div>
        </div>
    </header>

    <main>
        <div class="hero-banner">
            <h2>AuroraRPG: Chega em Breve!</h2>
        </div>

        <div class="hero-actions" id="heroActions"></div>

        <div class="hero-nav-cards">
            <a class="hero-nav-card" href="components/bestiario/monster-index.html">
                <h3>Bestiário</h3>
                <p>Consulte as criaturas do D&amp;D 5e, com filtros e statblock completo.</p>
            </a>
            <a class="hero-nav-card" href="components/personagens/personagens.html">
                <h3>Personagens</h3>
                <p>Crie e gerencie os aventureiros da sua conta.</p>
            </a>
            <a class="hero-nav-card" href="components/suporte/suporte.html">
                <h3>Suporte</h3>
                <p>Envie pedidos, sugestões ou relate problemas.</p>
            </a>
        </div>
    </main>

    <!-- Libs de animação via CDN (sem bundler). Se caírem, a página segue funcionando. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/slim@3/tsparticles.slim.bundle.min.js"></script>
    <script src="components/shared/session.js"></script>
    <script src="components/shared/card-fx.js"></script>
    <script src="components/landing/landing.js"></script>
</body>
</html>
